<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AmePhia Academia: gestión de cursos, alumnos, notas, bitácora de laboratorios y certificaciones, conectada a ContAme.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AmePhia Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: panel de operación — barra lateral fija + área de trabajo con tarjetas elevadas; misma familia visual que ContAme (monocromo + un acento cielo). */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef2f6; --fg:#0e1621; --muted:#5a6777; --border:#e2e7ee;
  --accent:#0369a1; --accent-soft:#e3f1fb; --accent-fg:#ffffff;
  --ok:#157f3c; --ok-soft:#e3f6e9; --warn:#a85d06; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fde8e6;
  --shadow:0 1px 2px rgba(14,22,33,.05),0 2px 6px rgba(14,22,33,.04);
  --shadow-lg:0 12px 40px rgba(14,22,33,.18);
  --cert-paper:#fffdf8; --cert-ink:#14202c; --cert-line:#c9b98f;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Inter Tight","Inter",-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1017; --surface:#101922; --surface-2:#17222e; --fg:#e6ecf2; --muted:#93a0af; --border:#212e3c;
  --accent:#38bdf8; --accent-soft:rgba(56,189,248,.13); --accent-fg:#04202f;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --shadow:0 0 0 1px rgba(255,255,255,.02); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --cert-paper:#fffdf8; --cert-ink:#14202c; --cert-line:#c9b98f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1017; --surface:#101922; --surface-2:#17222e; --fg:#e6ecf2; --muted:#93a0af; --border:#212e3c;
  --accent:#38bdf8; --accent-soft:rgba(56,189,248,.13); --accent-fg:#04202f;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --shadow:0 0 0 1px rgba(255,255,255,.02); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --cert-paper:#fffdf8; --cert-ink:#14202c; --cert-line:#c9b98f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0;text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.85em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* App shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px 24px;display:flex;flex-direction:column;gap:18px;padding-top:max(18px,env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--fg);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--font-display);font-size:15px;display:block;line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:10px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500;transition:background .15s}
.nav a svg{width:17px;height:17px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a.on svg{color:var(--accent)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;margin-bottom:-6px;padding:12px;border-radius:var(--r);background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar>*{flex-shrink:0}.topbar .search{flex-shrink:1}
.menu-btn{display:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.page{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px;max-width:70ch}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{font-size:11px;font-weight:600;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:inline-grid;place-items:center}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.kpi .v{font-family:var(--font-display);font-size:1.75rem;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi .d b{color:var(--ok);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--border)}
.list>div:last-child{border-bottom:0}
.stripe{width:3px;align-self:stretch;border-radius:3px;background:var(--accent);flex:none}
.stripe.warn{background:var(--warn)} .stripe.bad{background:var(--bad)} .stripe.ok{background:var(--ok)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .15s}
tbody tr.click:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--fg);flex:none}
.who b{font-weight:600;display:block;white-space:nowrap}
.who span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.input,.select{height:36px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:0 12px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500}
.field .input,.field .select{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}

/* Course cards */
.course{display:flex;flex-direction:column;gap:14px;padding:18px}
.course .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.split .t{background:var(--fg);opacity:.75}
.split .v{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.mods{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.mods li{display:flex;gap:8px}
.mods li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);margin-top:8px;flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px;border-top:1px solid var(--border)}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));min-width:920px}
.cal .day{border-right:1px solid var(--border);min-height:300px;display:flex;flex-direction:column}
.cal .day:last-child{border-right:0}
.cal .dh{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline}
.cal .dh b{font-family:var(--font-display);font-size:18px}
.cal .day.today .dh{color:var(--accent)}
.cal .day.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cal .slots{padding:8px;display:flex;flex-direction:column;gap:8px}
.sess{border-radius:9px;padding:9px 10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:4px;font-size:12.5px;cursor:pointer;transition:box-shadow .15s}
.sess:hover{box-shadow:var(--shadow-lg)}
.sess.lab{border-left-color:var(--ok)}
.sess.sim{border-left-color:var(--warn)}
.sess b{font-size:13px;font-weight:600;line-height:1.3}

/* Gradebook */
.gin{width:64px;height:32px;border:1px solid var(--border);border-radius:7px;background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.gin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.final{font-family:var(--font-display);font-weight:600;font-size:16px}
.reasons{display:flex;flex-direction:column;gap:3px}

/* Integration flow */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}
.step{position:relative;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:12.5px}
.step.ca .n{background:var(--fg);color:var(--bg)}
.step:not(:last-child)::after{content:"";position:absolute;right:-12px;top:28px;width:12px;height:2px;background:var(--border)}
.who-side{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* Modal / drawer / toast */
.overlay{position:fixed;inset:0;background:rgba(8,14,22,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.overlay.drawer{justify-content:flex-end;align-items:stretch;padding:0}
.drawer .modal{width:min(560px,100%);border-radius:0;max-height:none;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .2s ease-out}
.toast-wrap{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;max-width:min(380px,calc(100vw - 40px));display:flex;gap:9px;align-items:flex-start;animation:up .2s ease-out}
.toast svg{width:16px;height:16px;flex:none;margin-top:1px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.steps{display:flex;flex-direction:column;gap:2px}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;opacity:.35;transition:opacity .2s}
.pstep.done,.pstep.run{opacity:1}
.pstep .ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.pstep.done .ic{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.pstep.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.pstep .ic svg{width:14px;height:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.sec{display:flex;flex-direction:column;gap:10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.dl div{display:flex;flex-direction:column;gap:1px;min-width:0}
.dl span{font-size:11.5px;color:var(--muted)}
.dl b{font-weight:500;overflow-wrap:anywhere}
.inv{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.inv-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* Certificate */
.cert{background:var(--cert-paper);color:var(--cert-ink);border-radius:6px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.cert-in{border:1.5px solid var(--cert-line);outline:1px solid var(--cert-line);outline-offset:4px;padding:34px 36px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative}
.cert .issuer{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:#6b5a2e}
.cert h2{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:.01em;color:var(--cert-ink)}
.cert .name{font-family:var(--font-display);font-size:28px;font-weight:600;border-bottom:1px solid var(--cert-line);padding:2px 24px 8px;margin-top:4px}
.cert p{font-size:13.5px;color:#3c4752;max-width:52ch}
.cert .meta{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#3c4752;margin-top:6px}
.cert .meta b{display:block;color:var(--cert-ink);font-size:13px}
.cert-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:end;width:100%;margin-top:18px}
.sig{border-top:1px solid #8a8a8a;padding-top:6px;font-size:11.5px;color:#3c4752}
.sig b{display:block;color:var(--cert-ink);font-size:12.5px}
.qr{width:96px;height:96px;background:#fff;padding:4px;display:grid;place-items:center}
.qr img,.qr canvas{width:88px!important;height:88px!important}
.cert .code{font-family:var(--font-mono);font-size:11px;color:#3c4752;margin-top:4px}
.seal{position:absolute;top:22px;right:24px;width:62px;height:62px;border-radius:50%;border:2px solid var(--cert-line);display:grid;place-items:center;color:#6b5a2e}
.seal svg{width:30px;height:30px}

/* Portal (phone) */
.portal{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:32px;align-items:start}
.phone{border:10px solid var(--fg);border-radius:38px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow-lg);max-width:100%}
.phone-in{height:700px;overflow:auto;display:flex;flex-direction:column}
.ph-top{background:var(--accent);color:var(--accent-fg);padding:22px 18px 46px;display:flex;flex-direction:column;gap:4px}
.ph-top .hi{font-family:var(--font-display);font-size:20px;font-weight:600}
.ph-body{padding:0 14px 20px;margin-top:-30px;display:flex;flex-direction:column;gap:12px}
.ph-card{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.ring{width:64px;height:64px;flex:none}
.why{display:flex;flex-direction:column;gap:14px}
.why>div{display:flex;gap:12px}
.why .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

.verify{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.vrow{display:flex;gap:10px}

.vres{padding:20px;display:flex;flex-direction:column;gap:14px}
.vok{display:flex;gap:12px;align-items:center}
.vok .big{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.vok .big.bad{background:var(--bad-soft);color:var(--bad)}
.vok svg{width:22px;height:22px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-sans)}
.chart .lbl{fill:var(--fg);font-weight:600;font-size:11.5px}

/* v2: identidad y detalle */
:root{--av-l:36%;--av-bg:.13}

.av{background:hsl(var(--h,205) 70% 50% / var(--av-bg));color:hsl(var(--h,205) 62% var(--av-l))}
.av.sm{width:28px;height:28px;font-size:11px}
.page.enter{animation:pageIn .22s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.crumbs .sep{color:var(--muted);opacity:.5}
.search{position:relative;flex:0 1 400px;min-width:0}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;pointer-events:none}
.search input{width:100%;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 52px 0 34px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface-2)}
.spacer{flex:1 1 0}
.pop{position:absolute;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:20;overflow:hidden;padding-bottom:4px}
.search .pop{left:0;right:0}
.pop .pi{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;width:100%;border:0;background:none;text-align:left;color:var(--fg)}
.pop .pi:hover,.pop .pi:focus-visible{background:var(--surface-2)}
.pop .ph{padding:10px 12px 4px}
.pop .empty{padding:14px;color:var(--muted);font-size:13px}
.icon-btn{position:relative;width:36px;height:36px;padding:0}
.icon-btn .count{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.notif-wrap{position:relative}
.notif-wrap .pop{right:0;width:min(360px,calc(100vw - 32px))}
.notif-wrap .pi{align-items:flex-start}
.me{width:34px;height:34px;font-size:12px;cursor:default}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kic svg{width:16px;height:16px}
.kpi-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kpi-row svg{width:96px;height:32px;flex:none;overflow:visible}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px;padding:1px 6px;border-radius:6px;margin-right:4px}
.delta.up{color:var(--ok);background:var(--ok-soft)}.delta.down{color:var(--bad);background:var(--bad-soft)}
.g-dash{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr)}
.course{padding:0;overflow:hidden;gap:0;transition:box-shadow .15s,transform .15s}
.course:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.course-body{padding:30px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}

.course-art .cico svg{width:21px;height:21px}
.course-art .ctag{position:absolute;right:12px;top:12px;background:var(--surface);color:var(--fg)}
.code{font-family:var(--font-mono);font-size:12px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--surface-2);white-space:nowrap}
.final.pill{display:inline-block;min-width:48px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--surface-2)}
.final.pill.ok{background:var(--ok-soft);color:var(--ok)}.final.pill.bad{background:var(--bad-soft);color:var(--bad)}
.sess{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}

.sess.sim{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.wx{display:flex;gap:12px;align-items:center}
.wind{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;flex:none;background:var(--surface-2)}
.wind svg{width:18px;height:18px;color:var(--accent)}
.wx-meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.wx-meta b{color:var(--fg);font-weight:600}
.me-card{display:flex;align-items:center;gap:10px;padding:2px 6px}
.me-card b{display:block;font-size:13px;line-height:1.3}
.nav a.on{font-weight:600}
.hero-strip{display:flex;gap:10px;flex-wrap:wrap}
.hero-strip .chip{height:26px;padding:0 10px;font-size:12.5px}
@media (max-width:1250px){.topbar .sync{display:none}}

}
@media (max-width:640px){

  .form-grid,.dl{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar .btn .lbl{display:none}

  .cert-foot{grid-template-columns:1fr 1fr}

  .seal{display:none}
  .vrow{flex-direction:column}
  .phone{border-width:6px;border-radius:28px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,14,22,.4);z-index:25}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const ic = (n, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;

/* ===================== Utilidades ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(1824);
const R = (a,b) => a + rng()*(b-a);
const pick = arr => arr[Math.floor(rng()*arr.length)];
const r1 = x => Math.round(x*10)/10;
const money = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pdate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays = (dt,n) => { const x = new Date(dt); x.setDate(x.getDate()+n); return x; };
const fd = (s, o={day:'numeric',month:'short',year:'numeric'}) => (typeof s === 'string' ? pdate(s) : s).toLocaleDateString('es-EC', o).replace('.', '');
const TODAY = new Date(2026,10,18);
const daysTo = s => Math.round((pdate(s) - TODAY)/86400000);
const initials = n => n.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
const hrs = m => r1(m/60).toLocaleString('es-EC',{minimumFractionDigits:1,maximumFractionDigits:1});
const n1 = v => v == null ? '—' : Number(v).toLocaleString('es-EC',{minimumFractionDigits:1,maximumFractionDigits:1});
const slug = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(' ').join('.');

const HUES = [200,165,275,18,340,120,230,45,300,185];
const hue = n => HUES[[...n].reduce((a,c) => (a*31 + c.charCodeAt(0)) >>> 0, 7) % HUES.length];
const av = (n, cls='') => `<span class="av ${cls}" style="--h:${hue(n)}">${initials(n)}</span>`;
function spark(vals){
  const w = 96, h = 32, mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx - mn) || 1;
  const pts = vals.map((v,i) => [i*(w/(vals.length-1)), h - 3 - ((v-mn)/sp)*(h-8)]);
  const line = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="0,${h} ${line} ${w},${h}" style="fill:var(--accent);opacity:.12"/><polyline points="${line}" style="fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" style="fill:var(--accent);stroke:var(--surface);stroke-width:1.5"/></svg>`;
}
function kpi(label, icon, value, sub, vals, delta){

    <span class="d">${delta ? `<span class="delta ${delta[1]}">${delta[0]}</span>` : ''}${sub}</span></div>`;
}

/* ===================== Reglas académicas ===================== */
const W = {teo:.30, sim:.15, lab:.45, asis:.10};
const MIN_GRADE = 7;
function finalGrade(s){
  let sum = 0, w = 0;
  for (const k of ['teo','sim','lab','asis']) { const v = s.g[k]; if (v == null || v === '') continue; const val = k==='asis' ? v/10 : +v; sum += val*W[k]; w += W[k]; }
  if (!w) return {value:null, complete:false};
  return {value: r1(sum/w), complete: w > .999};
}
function academic(s){
  const g = group(s.group), c = course(g.course), f = finalGrade(s);
  const hoursOk = s.labMin >= c.minLab*60;
  if (g.state === 'Inscripciones abiertas') return {label:'Inscrito', cls:''};
  if (f.value == null) return {label:'En curso', cls:'acc'};
  if (f.value < MIN_GRADE || (s.g.asis != null && s.g.asis < 75)) return {label:'En riesgo', cls:'bad'};
  if (f.complete && hoursOk) return {label:'Aprobado', cls:'ok'};
  return {label:'En curso', cls:'acc'};
}
function eligibility(s){
  const c = course(group(s.group).course), f = finalGrade(s), reasons = [];
  if (!f.complete) reasons.push({t:'Faltan notas por registrar', cls:''});
  else if (f.value < MIN_GRADE) reasons.push({t:'Nota final '+n1(f.value)+' (mínimo 7,0)', cls:'bad'});
  if (s.labMin < c.minLab*60) reasons.push({t:'Horas de laboratorio '+hrs(s.labMin)+' de '+c.minLab+' h', cls:'warn'});
  if (state.requirePaid && s.balance > 0) reasons.push({t:'Saldo '+money(s.balance)+' en ContAme', cls:'warn'});
  if (CERTS.some(x => x.sid === s.id)) return {ok:false, issued:true, reasons:[]};
  return {ok: reasons.length === 0, reasons};
}
function payChip(s){ return s.balance > 0 ? `<span class="chip warn">Saldo ${money(s.balance)}</span>` : `<span class="chip ok">${ic('check','style="width:12px;height:12px"')}Al día</span>`; }

function labsOf(s){
  if (state.labsCache[s.id]) return state.labsCache[s.id];
  const g = group(s.group), c = course(g.course), r = mulberry32(parseInt(s.id.slice(3)) * 97);
  const list = []; let left = s.labMin, dt = pdate(g.start), k = 0;
  const pool = ENVS_BY[c.id], types = LAB_TYPES[c.id];
  while (left > 0 && k < 40) {
    const m = Math.min(left, Math.round(18 + r()*30));
    list.push({date: iso(dt), env: pool[Math.floor(r()*pool.length)], type: types[Math.floor(r()*types.length)], min:m, instructor:g.instructor, ok:true, note: r() < .25 ? 'Resolvió el error de permisos sin ayuda' : ''});
    left -= m; k++; if (k % 2 === 0) dt = addDays(dt, 7);
    if (dt > TODAY) dt = addDays(TODAY, -1);
  }
  state.labsCache[s.id] = list.reverse();
  return state.labsCache[s.id];
}

function barChart(data){
  const Wd = 640, H = 230, pl = 46, pr = 10, pt = 22, pb = 40, max = 12000;
  const iw = Wd - pl - pr, ih = H - pt - pb, bw = iw / data.length;
  const y = v => pt + ih - (v/max)*ih;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Ingresos por mes">`;
  [0,4000,8000,12000].forEach(t => { s += `<line x1="${pl}" x2="${Wd-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t?('$'+t/1000+'k'):'0'}</text>`; });
  data.forEach(([m,v,n],i) => {
    const x = pl + i*bw + bw*.22, w = bw*.56, last = i === data.length-1;
    s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${pt+ih-y(v)}" rx="5" fill="var(--accent)" opacity="${last?1:.32}"/>`;
    s += `<text class="lbl" x="${x+w/2}" y="${y(v)-7}" text-anchor="middle">${money0(v)}</text>`;
    s += `<text x="${x+w/2}" y="${H-pb+17}" text-anchor="middle" style="text-transform:capitalize">${m}${last?' (al 18)':''}</text>`;
    s += `<text x="${x+w/2}" y="${H-pb+32}" text-anchor="middle">${n} matr.</text>`;
  });
  return s + '</svg>';
}

const COURSE_HUE = {'CLF-101':200,'SAA-201':228,'K8S-301':165,'DVA-310':275,'SEC-320':18,'DAT-150':105};
const COURSE_ICON = {'CLF-101':'cloud','SAA-201':'box','K8S-301':'code','DVA-310':'spark','SEC-320':'lock','DAT-150':'chart'};
function courseArt(c){
  const h = COURSE_HUE[c.id] ?? 200, r = mulberry32([...c.id].reduce((a,ch) => a + ch.charCodeAt(0)*7, 3));
  const cx = 230 + r()*120, cy = 26 + r()*40, st = a => `stroke:hsl(${h} 62% var(--av-l) / ${a})`;
  let rings = ''; for (let i = 1; i <= 8; i++) rings += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${(i*24 + r()*8).toFixed(0)}" ry="${(i*13 + r()*5).toFixed(0)}" style="fill:none;${st(.22)};stroke-width:1"/>`;
  const pts = []; let x = -10, y = 66 + r()*16; while (x < 430) { pts.push([x, y]); x += 46 + r()*34; y = 18 + r()*58; }
  const poly = pts.map(p => p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  const dots = pts.slice(1,-1).map(p => `<circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="3" style="fill:var(--surface);${st(1)};stroke-width:1.5"/>`).join('');
  return `<div class="course-art" style="--h:${h}"><svg viewBox="0 0 400 92" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${rings}<polyline points="${poly}" style="fill:none;${st(.75)};stroke-width:1.5;stroke-dasharray:4 5"/>${dots}</svg><span class="chip ctag">${c.level}</span><span class="cico">${ic(COURSE_ICON[c.id] || 'book')}</span></div>`;
}

}

}

        <div class="field full"><label for="en-name">Nombre completo</label><input id="en-name" class="input" required placeholder="Nombre y apellido"></div>

        <div class="field"><label for="en-phone">Celular</label><input id="en-phone" class="input" inputmode="tel" placeholder="09…"></div>
        <div class="field full"><label for="en-email">Correo (recibe la factura y el acceso al portal)</label><input id="en-email" class="input" type="email" placeholder="nombre@correo.com"></div>
        <div class="field full"><label for="en-group">Curso y grupo</label><select id="en-group" class="select">${opts}</select></div>
        <div class="field"><label for="en-payer">¿Quién paga?</label><select id="en-payer" class="select"><option value="">El alumno</option><option value="company">Una empresa</option></select></div>
        <div class="field"><label for="en-plan">Forma de pago</label><select id="en-plan" class="select"><option value="full">Contado · transferencia</option><option value="card">Contado · tarjeta</option><option value="2">Dos cuotas</option></select></div>
        <div class="field full" id="company-field" hidden><label for="en-company">Razón social de la empresa</label><input id="en-company" class="input" placeholder="Razón social que va en la factura"></div>
      </div>
      <label class="switch"><input type="checkbox" id="en-inv" checked><span>Emitir la factura electrónica en ContAme ahora</span></label>
      <p class="small" id="en-err" style="color:var(--bad)" hidden>Escribe el nombre del alumno para continuar.</p>
    </div>
    <div class="modal-foot"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">${ic('check')}Matricular y facturar</button></div>
    </form>`);
}
function runEnroll(){
  const name = document.getElementById('en-name').value.trim();
  if (!name) { document.getElementById('en-err').hidden = false; document.getElementById('en-name').focus(); return; }
  const gid = document.getElementById('en-group').value, g = group(gid), c = course(g.course);
  const plan = document.getElementById('en-plan').value, invoice = document.getElementById('en-inv').checked;
  const company = document.getElementById('en-payer').value === 'company' ? (document.getElementById('en-company').value.trim() || 'Empresa patrocinadora') : null;
  const email = document.getElementById('en-email').value.trim() || slug(name)+'@ejemplo.ec';
  const s = { id:'AL-'+String(1040 + STUDENTS.length + 1).padStart(4,'0'), name, ced: document.getElementById('en-ced').value.trim() || '0900000000', email, phone: document.getElementById('en-phone').value.trim() || '—',
    city:g.city, group:gid, payer:company, g:{teo:null,sim:null,lab:null,asis:null}, labMin:0, balance: plan==='2' ? c.price/2 : 0, enrolled: iso(TODAY), isNew:true };
  const inv = buildInvoice(s); inv.date = iso(TODAY); inv.entry = '2026-11-'+String(entrySeq).padStart(4,'0');
  s.invoices = invoice ? [inv] : [];
  const steps = [
    ['Alumno registrado en la Academia', `${s.id} · ${c.id} · ${g.id}`],
    ['Cliente creado en ContAme', company ? company : name],
    ...(invoice ? [
      ['Factura generada', `${inv.num} · ${money(c.price)}`],
      ['Firmada y enviada al SRI', 'Firma electrónica de la empresa'],
      ['Autorizada por el SRI', 'Clave de acceso de 49 dígitos registrada'],
      ['RIDE y XML enviados al correo', email],
      ['Asiento contable registrado', `${inv.entry} · cuentas por cobrar e ingresos por capacitación`],
      [plan==='2' ? 'Primera cuota cobrada, segunda en cartera' : 'Cobro registrado', plan==='2' ? `Cobrado ${money(c.price/2)} · saldo ${money(c.price/2)}` : money(c.price)]
    ] : []),
    ['Acceso al portal enviado', 'El alumno ya ve su horario y su próxima clase']
  ];
  document.querySelector('.modal').innerHTML = mhead('Matriculando a ' + esc(name), 'AmePhia Academia y ContAme trabajando juntos') +
    `<div class="modal-body"><div class="steps">${steps.map(([t,d],i) => `<div class="pstep" id="ps-${i}"><span class="ic"></span><div><b style="font-weight:600">${esc(t)}</b><p class="small muted">${esc(d)}</p></div></div>`).join('')}</div></div>
     <div class="modal-foot" id="ps-foot" hidden><button class="btn" data-act="close">Cerrar</button><button class="btn primary" data-act="student-after" data-id="${s.id}">Ver ficha del alumno</button></div>`;
  let i = 0;
  const tick = () => {
    if (i > 0) { const p = document.getElementById('ps-'+(i-1)); if (!p) return; p.className = 'pstep done'; p.querySelector('.ic').innerHTML = ic('check'); }
    if (i < steps.length) { const p = document.getElementById('ps-'+i); if (!p) return; p.className = 'pstep run'; i++; setTimeout(tick, i===4||i===5 ? 750 : 480); return; }
    STUDENTS.unshift(s);
    if (invoice) { EVENTS.unshift({t:'Ahora', kind:'ledger', text:'Asiento '+inv.entry+' contabilizado', sub:'Matrícula de '+name}, {t:'Ahora', kind:'sri', text:'Factura '+inv.num+' autorizada por el SRI', sub:'Matrícula de '+name+' · '+c.id}); entrySeq++; }
    document.getElementById('ps-foot').hidden = false;
    renderNav((location.hash||'#tablero').slice(1));
    if (['alumnos','tablero','contame'].includes((location.hash||'#tablero').slice(1))) route();
  };
  tick();
}

function searchHtml(q){
  q = q.trim().toLowerCase(); if (!q) return '';
  const st = STUDENTS.filter(s => (s.name+' '+s.ced+' '+s.email).toLowerCase().includes(q)).slice(0,5);
  const co = COURSES.filter(c => (c.id+' '+c.name).toLowerCase().includes(q)).slice(0,3);
  const ce = CERTS.filter(c => (c.code+' '+c.name).toLowerCase().includes(q)).slice(0,3);
  if (!st.length && !co.length && !ce.length) return `<div class="empty">Sin resultados para «${esc(q)}».</div>`;
  return (st.length ? '<div class="ph eyebrow">Alumnos</div>' + st.map(s => `<button class="pi" data-act="student" data-id="${s.id}">${av(s.name,'sm')}<span style="min-width:0"><b style="display:block;font-weight:600">${esc(s.name)}</b><span class="small muted">${group(s.group).course} · ${s.group} · ${s.city}</span></span></button>`).join('') : '')
    + (co.length ? '<div class="ph eyebrow">Cursos</div>' + co.map(c => `<button class="pi" data-act="go" data-h="cursos"><span class="kic">${ic(COURSE_ICON[c.id] || 'book')}</span><span><b style="display:block;font-weight:600">${esc(c.name)}</b><span class="small muted">${c.id} · ${money0(c.price)}</span></span></button>`).join('') : '')
    + (ce.length ? '<div class="ph eyebrow">Certificados</div>' + ce.map(c => `<button class="pi" data-act="cert" data-code="${c.code}"><span class="kic">${ic('cert')}</span><span><b style="display:block;font-weight:600">${esc(c.name)}</b><span class="small muted mono">${c.code}</span></span></button>`).join('') : '');
}
function notifHtml(){
  const exp = CERTS.filter(c => daysTo(c.expires) >= 0 && daysTo(c.expires) <= 60).length;
  const items = [['warn','cert',exp+' certificados vencen pronto','Ofrece la renovación desde Certificados','certificados'],
    ['bad','cloud','Créditos de SAA-201 al 86 %','Revisa el consumo de la cuenta de práctica','recursos'],
    ['acc','grade','G03 cierra notas el 28 de noviembre','3 alumnos listos para certificar','notas'],
    ['ok','coin','Cobro de $225.00 recibido','ContAme actualizó la cartera de Joaquín Salazar','alumnos']];
  return '<div class="ph eyebrow">Avisos</div>' + items.map(([c,i,t,d,h]) => `<button class="pi" data-act="go" data-h="${h}"><span class="kic" style="background:var(--${c==='acc'?'accent':c}-soft);color:var(--${c==='acc'?'accent':c})">${ic(i)}</span><span><b style="display:block;font-weight:600">${t}</b><span class="small muted">${d}</span></span></button>`).join('');
}
function closePops(){ const a = document.getElementById('sres'), b = document.getElementById('notif'); if (a) a.hidden = true; if (b) b.hidden = true; }
document.addEventListener('click', e => { if (e.target.closest('.pop .pi') || (!e.target.closest('.search') && !e.target.closest('.notif-wrap'))) closePops(); }, true);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('gsearch').focus(); }
  if (e.key === 'Escape') closePops();
});

/* ===================== Eventos ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'close-overlay' && e.target !== t) return;
  switch (act) {
    case 'open-nav': document.body.classList.add('nav-open'); break;
    case 'close-nav': document.body.classList.remove('nav-open'); break;
    case 'close': case 'close-overlay': closeModal(); break;
    case 'enroll': enrollModal(); break;
    case 'enroll-sample':
      document.getElementById('en-name').value = 'Renato Aguirre'; document.getElementById('en-ced').value = '0923456781';
      document.getElementById('en-phone').value = '0987654321'; document.getElementById('en-email').value = 'renato.aguirre@ejemplo.ec';
      document.getElementById('en-group').value = 'G15'; document.getElementById('en-plan').value = '2'; break;
    case 'student': studentDrawer(t.dataset.id); break;
    case 'student-after': location.hash = 'alumnos'; setTimeout(() => studentDrawer(t.dataset.id), 30); break;
    case 'goto-log': state.bitStudent = t.dataset.id; closeModal(); location.hash === '#bitacora' ? route() : (location.hash = 'bitacora'); break;
    case 'pay': { const s = STUDENTS.find(x => x.id === t.dataset.id); const amt = s.balance; if (s.invoices[0]) s.invoices[0].paid += amt; s.balance = 0;
      EVENTS.unshift({t:'Ahora', kind:'pay', text:'Cobro registrado: '+money(amt), sub:s.name+' · cartera al día'});
      studentDrawer(s.id); toast(`Cobro de ${money(amt)} registrado en ContAme. ${esc(s.name)} queda al día.`); if ((location.hash||'').slice(1)==='alumnos') renderRows(); break; }
    case 'cert': certModal(t.dataset.code); break;
    case 'verify-this': state.verifyCode = t.dataset.code; closeModal(); if (location.hash === '#verificar') route(); break;
    case 'vfill': state.verifyCode = t.dataset.code; document.getElementById('vcode').value = t.dataset.code; doVerify(); break;
    case 'recert': { const c = CERTS.find(x => x.code === t.dataset.code); toast(`Proforma de recertificación creada en ContAme para ${esc(c.name)} y lista para enviar.`); break; }
    case 'toast': toast(t.dataset.msg); break;
    case 'go': if (location.hash === '#'+t.dataset.h) route(); else location.hash = t.dataset.h; break;
    case 'notif': { const n = document.getElementById('notif'); const open = n.hidden; closePops(); if (open) { n.innerHTML = notifHtml(); n.hidden = false; } break; }
    case 'import': toast('Importa alumnos desde Excel o CSV; los repetidos se detectan por cédula.'); break;
    case 'new-course': courseModal(); break;
    case 'attendance': attendanceModal(+t.dataset.i); break;
    case 'att-save': { const i = +t.dataset.i, x = SESSIONS[i]; const boxes = [...document.querySelectorAll('[data-att]')]; const p = boxes.filter(b => b.checked).length;
      x.taken = true; closeModal(); route(); toast(`Asistencia guardada: ${p} de ${boxes.length} presentes.`); break; }
    case 'issue': issueCerts(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.sess')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { state.q = t.value; renderRows(); }
  if (t.id === 'gsearch') { const r = document.getElementById('sres'); const h = searchHtml(t.value); r.innerHTML = h; r.hidden = !h; }
  if (t.dataset.grade) {
    const s = STUDENTS.find(x => x.id === t.dataset.sid), raw = t.value.replace(',', '.').trim();
    let v = raw === '' ? null : Number(raw);
    if (v != null && (isNaN(v) || v < 0 || v > (t.dataset.grade==='asis' ? 100 : 10))) { t.style.borderColor = 'var(--bad)'; return; }
    t.style.borderColor = ''; s.g[t.dataset.grade] = v; updateGradeRow(s);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fgroup') { state.fGroup = t.value; renderRows(); }
  if (t.id === 'ngroup') { state.notasGroup = t.value; route(); }
  if (t.id === 'bstudent') { state.bitStudent = t.value; route(); }
  if (t.id === 'en-payer') document.getElementById('company-field').hidden = t.value !== 'company';
  if (t.id === 'sw-paid') { state.requirePaid = t.checked; toast(t.checked ? 'El certificado se retiene mientras haya saldo pendiente.' : 'El certificado ya no depende del pago.'); }
  if (t.id === 'sw-ride' || t.id === 'sw-inst') toast('Preferencia guardada.');
});
document.addEventListener('click', e => {
  const f = e.target.closest('#fstate button'); if (f) { state.fState = f.dataset.f; document.querySelectorAll('#fstate button').forEach(b => b.classList.toggle('on', b === f)); renderRows(); }
  const c = e.target.closest('#ctab button'); if (c) { state.certTab = c.dataset.t; route(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'enroll-form') runEnroll();
  if (e.target.id === 'verify-form') { state.verifyCode = document.getElementById('vcode').value; doVerify(); }
  if (e.target.id === 'lab-form') {
    const s = STUDENTS.find(x => x.id === state.bitStudent), m = Math.max(1, Math.min(120, +document.getElementById('ff-min').value || 0));
    labsOf(s).unshift({date:document.getElementById('ff-date').value || iso(TODAY), env:document.getElementById('ff-env').value, type:document.getElementById('ff-type').value, min:m, instructor:group(s.group).instructor, ok:true, note:document.getElementById('ff-note').value.trim()});
    s.labMin += m; route(); toast(`Laboratorio de ${m} min registrado y revisado. ${esc(s.name)} suma ${hrs(s.labMin)} h.`);
  }
  if (e.target.id === 'course-form') {
    const name = document.getElementById('nc-name').value.trim(); if (!name) { document.getElementById('nc-name').focus(); return; }
    const id = (document.getElementById('nc-code').value.trim() || 'CUR-'+(COURSES.length+1)).toUpperCase();
    COURSES.push({id, name, level:'Especialización', teo:+document.getElementById('nc-teo').value||10, lab:+document.getElementById('nc-lab').value||10, minLab:+document.getElementById('nc-min').value||0, price:+document.getElementById('nc-price').value||0, months:24, modules:['Módulos por definir'], cert:name});
    ENVS_BY[id] = ['LAB-01']; LAB_TYPES[id] = ['Práctica general'];
    closeModal(); route(); toast(`Curso ${esc(id)} creado y enlazado como producto en ContAme.`);
  }
});

function courseModal(){
  openModal(mhead('Nuevo curso', 'Se crea también como producto en ContAme para poder facturarlo.') + `
  <form id="course-form"><div class="modal-body"><div class="form-grid">
    <div class="field full"><label for="nc-name">Nombre del curso</label><input id="nc-name" class="input" placeholder="Ej.: Topografía con envs RTK"></div>
    <div class="field"><label for="nc-code">Código</label><input id="nc-code" class="input" placeholder="TOP-330"></div>
    <div class="field"><label for="nc-price">Precio (USD)</label><input id="nc-price" class="input" type="number" min="0" value="590"></div>
    <div class="field"><label for="nc-teo">Horas de teoría</label><input id="nc-teo" class="input" type="number" min="0" value="14"></div>
    <div class="field"><label for="nc-lab">Horas de práctica</label><input id="nc-lab" class="input" type="number" min="0" value="18"></div>
    <div class="field"><label for="nc-min">Horas de laboratorio mínimas para certificar</label><input id="nc-min" class="input" type="number" min="0" value="8"></div>
  </div></div>
  <div class="modal-foot"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Crear curso</button></div></form>`);
}

function attendanceModal(i){
  const x = SESSIONS[i], g = group(x.g), list = STUDENTS.filter(s => s.group === x.g);
  const r = mulberry32(i*31+7);
  openModal(mhead('Asistencia', `${esc(x.title)} · ${g.course} · ${g.id} · ${x.from}–${x.to}`) + `
    <div class="modal-body">
      ${x.envs?`<div class="inv"><div class="inv-row"><b>Entorno reservado</b><span class="mono">${x.envs}</span></div><span class="small muted">Las horas de cada alumno se suman a su bitácora al cerrar el laboratorio.</span></div>`:''}
      <div class="list" style="border:1px solid var(--border);border-radius:10px">${list.map(s => `
        <div style="align-items:center">${av(s.name)}<div style="flex:1;min-width:0"><b style="font-weight:600">${esc(s.name)}</b><p class="small muted">Asistencia acumulada ${s.g.asis ?? 100} %</p></div>
        <label class="switch"><input type="checkbox" data-att id="att-${i}-${s.id}" ${x.taken ? (r() > .12 ? 'checked' : '') : 'checked'}><span class="small">Presente</span></label></div>`).join('')}</div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="att-save" data-i="${i}">${ic('check')}Guardar asistencia</button></div>`);
}

function issueCerts(){
  const ready = STUDENTS.filter(s => s.group === state.notasGroup && eligibility(s).ok);
  if (!ready.length) return;
  const c = course(group(state.notasGroup).course);
  ready.forEach(s => {
    const exp = new Date(TODAY); exp.setMonth(exp.getMonth() + c.months);
    CERTS.unshift({code:'AA-'+c.id.replace('-','')+'-2026-'+String(certSeq++).padStart(4,'0'), name:s.name, course:c.id, issued:iso(TODAY), expires:iso(exp), grade:finalGrade(s).value, labMin:s.labMin, ced:s.ced, sid:s.id});
    EVENTS.unshift({t:'Ahora', kind:'cert', text:'Certificado emitido: '+s.name, sub:c.id+' · nota '+n1(finalGrade(s).value)+' · cuenta al día en ContAme'});
  });
  STUDENTS.filter(s => s.group === state.notasGroup).forEach(updateGradeRow);
  toast(`${ready.length} certificado${ready.length>1?'s':''} emitido${ready.length>1?'s':''} con código y QR. Se enviaron a cada alumno.`);
  setTimeout(() => certModal(CERTS[0].code), 400);
}

route();
</script>
</body>
</html>
