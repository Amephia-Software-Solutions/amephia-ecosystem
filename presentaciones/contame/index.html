<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContAme · Presentación del sistema | AmePhia</title>
  <meta name="description" content="Presentación de ContAme, el sistema de gestión para empresas del Ecuador: facturación electrónica con el SRI, compras, inventario, producción, contabilidad, impuestos y nómina en un solo lugar." />
  <link rel="canonical" href="https://amephia.com/presentaciones/contame/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AmePhia" />
  <meta property="og:title" content="ContAme · Presentación del sistema" />
  <meta property="og:description" content="Toda su empresa en un solo sistema: 25 láminas sobre cómo funciona ContAme, área por área." />
  <meta property="og:url" content="https://amephia.com/presentaciones/contame/" />
  <meta property="og:image" content="https://amephia.com/presentaciones/contame/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="slides/01-cover.webp?v=2" as="image" />
  <style>
    @font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/geist-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/geist-mono-latin.woff2') format('woff2'); }
    :root {
      --bg: #060B16; --panel: #0B1324; --ink: #F1F5FF; --mute: #97A6C6; --line: rgba(148, 163, 220, 0.16);
      --sig: #7DB0FF; --solid: #2563EB;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
    a { color: inherit; }
    .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }

    /* barra superior */
    .bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: -.01em; }
    .brand img { width: 26px; height: 26px; }
    .crumb { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb a { text-decoration: none; }
    .crumb a:hover { color: var(--ink); }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: var(--sig); }
    .btn.primary { background: var(--solid); border-color: var(--solid); color: #fff; }
    .btn.primary:hover { background: #1D4ED8; }
    .btn svg { width: 16px; height: 16px; }

    /* escenario */
    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 8px; gap: 14px; min-height: 0; }
    .stage { position: relative; width: min(100%, calc((100vh - 250px) * 16 / 9)); min-width: min(100%, 320px); aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0f172a; box-shadow: 0 30px 80px -30px rgba(37, 99, 235, .35); border: 1px solid var(--line); user-select: none; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
    .hit { position: absolute; top: 0; bottom: 0; width: 50%; background: none; border: 0; padding: 0; cursor: pointer; }
    .hit.prev { left: 0; cursor: w-resize; }
    .hit.next { right: 0; cursor: e-resize; }
    .hit:focus-visible { outline: 2px solid var(--sig); outline-offset: -4px; }

    /* controles */
    .controls { width: min(100%, calc((100vh - 250px) * 16 / 9)); min-width: min(100%, 320px); display: flex; align-items: center; gap: 12px; }
    .round { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
    .round:hover:not(:disabled) { border-color: var(--sig); }
    .round:disabled { opacity: .35; cursor: default; }
    .round svg { width: 18px; height: 18px; }
    .info { flex: 1; min-width: 0; }
    .info .t { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info .n { font-size: 11px; letter-spacing: .1em; color: var(--mute); margin-top: 2px; }
    .progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .progress i { display: block; height: 100%; width: 0; background: var(--sig); transition: width .25s ease; }

    /* miniaturas */
    .thumbs { width: 100%; display: flex; gap: 8px; overflow-x: auto; padding: 6px 20px 18px; scroll-snap-type: x proximity; }
    .thumbs button { flex: none; width: 128px; aspect-ratio: 16 / 9; padding: 0; border-radius: 6px; overflow: hidden; border: 2px solid transparent; background: #0f172a; cursor: pointer; opacity: .55; scroll-snap-align: center; position: relative; }
    .thumbs button:hover { opacity: .9; }
    .thumbs button[aria-current="true"] { border-color: var(--sig); opacity: 1; }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumbs span { position: absolute; left: 4px; bottom: 3px; font-size: 10px; color: #fff; background: rgba(6, 11, 22, .7); padding: 0 4px; border-radius: 3px; }

    /* pantalla completa */
    body.fs .bar, body.fs .thumbs, body.fs .controls { display: none; }
    body.fs main { padding: 0; justify-content: center; background: #000; }
    body.fs .stage { width: min(100vw, calc(100vh * 16 / 9)); border: 0; border-radius: 0; box-shadow: none; }

    .noscript { max-width: 960px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .noscript img { width: 100%; border-radius: 8px; }

    @media (max-width: 640px) {
      .bar { padding: 10px 16px; gap: 10px; }
      .brand span, .crumb, .hide-sm { display: none; }
      main { flex: none; padding: 16px 16px 4px; }
      .stage, .controls { width: 100%; min-width: 0; }
      .thumbs { padding: 6px 16px 16px; }
      .thumbs button { width: 104px; }
    }
    @media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="AmePhia, inicio"><img src="/assets/logo-nav.webp" alt="" width="26" height="26" /><span>AmePhia</span></a>
    <nav class="crumb mono" aria-label="Ruta"><a href="/presentaciones/">Presentaciones</a> / ContAme</nav>
    <div class="spacer"></div>
    <a class="btn" href="contame-presentacion.pdf?v=2" download="contame-presentacion.pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
      <span>PDF</span>
    </a>
    <button class="btn" id="fs" type="button" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="hide-sm">Pantalla completa</span>
    </button>
    <a class="btn primary hide-sm" href="https://contame593.com" target="_blank" rel="noopener">Conocer ContAme</a>
  </header>

  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ContAme · Presentación del sistema</h1>
    <div class="stage" id="stage" aria-roledescription="carrusel" aria-label="Láminas de la presentación">
      <img id="slide" src="slides/01-cover.webp?v=2" alt="Lámina 1: Toda su empresa en un solo sistema" width="1920" height="1080" />
      <button class="hit prev" id="hitPrev" type="button" aria-label="Lámina anterior"></button>
      <button class="hit next" id="hitNext" type="button" aria-label="Lámina siguiente"></button>
    </div>
    <div class="controls">
      <button class="round" id="prev" type="button" aria-label="Lámina anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="info">
        <div class="t" id="title" aria-live="polite">Toda su empresa en un solo sistema</div>
        <div class="n mono" id="count">1 / 25</div>
        <div class="progress"><i id="bar"></i></div>
      </div>
      <button class="round" id="next" type="button" aria-label="Lámina siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </main>
  <nav class="thumbs" id="thumbs" aria-label="Todas las láminas"></nav>

  <noscript>
    <p class="noscript">Para pasar las láminas se necesita JavaScript. También puede <a href="contame-presentacion.pdf?v=2">descargar la presentación en PDF</a>.</p>
  </noscript>

  <script>
    (function () {
      var SLIDES = [
        ['01-cover', 'Toda su empresa en un solo sistema'],
        ['02-reto', 'La información de la empresa vive en lugares que no se hablan'],
        ['03-que-es', 'Un sistema de gestión hecho para empresas del Ecuador'],
        ['04-idea', 'La idea central: se registra una vez, lo demás se escribe solo'],
        ['05-aprende', 'Cada aprobación le enseña. Cada mes se digita menos.'],
        ['06-inteligente', 'Pregúntele a su sistema, como a un colega'],
        ['07-mapa', 'Doce áreas, una sola información'],
        ['08-tablero', 'Todo el negocio en una pantalla'],
        ['09-facturacion', 'Facturar con el SRI, sin pasos extra'],
        ['10-pos', 'La caja del local, conectada a todo'],
        ['11-compras', 'Las compras llegan solas del SRI'],
        ['12-cobrar', 'Saber quién debe y desde cuándo'],
        ['13-pagar', 'Pagar ordenado y cuadrar el banco'],
        ['14-inventario', 'Qué hay, dónde está y cuánto vale'],
        ['15-importaciones', 'El costo real de cada producto importado'],
        ['16-produccion', 'Cuánto cuesta de verdad lo que fabrica'],
        ['17-contabilidad', 'Los libros se escriben solos'],
        ['18-impuestos', 'Saber qué declarar, sin armar nada a mano'],
        ['19-nomina', 'Roles de pago con la normativa ecuatoriana'],
        ['20-reportes', 'Reportes gerenciales y alertas'],
        ['21-sri', 'Conectado al SRI en tres sentidos'],
        ['22-seguridad', 'La información, bajo control'],
        ['23-arranque', 'Cómo se empieza a trabajar'],
        ['24-recorrido', 'Ahora, el sistema en vivo'],
        ['25-cierre', 'Un sistema que registra, automatiza y prepara a su empresa para crecer']
      ];
      var total = SLIDES.length;
      var img = document.getElementById('slide');
      var title = document.getElementById('title');
      var count = document.getElementById('count');
      var bar = document.getElementById('bar');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var thumbs = document.getElementById('thumbs');
      var cache = {};
      var current = 0;
      var started = false;

      // ?v= cambia cada vez que se reexportan las láminas: el servidor las guarda en caché un año.
      var VERSION = '2';
      var src = function (i) { return 'slides/' + SLIDES[i][0] + '.webp?v=' + VERSION; };
      var preload = function (i) {
        if (i < 0 || i >= total || cache[i]) return;
        cache[i] = new Image();
        cache[i].src = src(i);
      };

      SLIDES.forEach(function (s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Lámina ' + (i + 1) + ': ' + s[1]);
        b.innerHTML = '<img src="' + src(i) + '" alt="" loading="lazy" width="192" height="108"><span class="mono">' + (i + 1) + '</span>';
        b.addEventListener('click', function () { go(i); });
        thumbs.appendChild(b);
      });

      function go(i) {
        current = Math.max(0, Math.min(total - 1, i));
        img.src = src(current);
        img.alt = 'Lámina ' + (current + 1) + ': ' + SLIDES[current][1];
        title.textContent = SLIDES[current][1];
        count.textContent = (current + 1) + ' / ' + total;
        bar.style.width = ((current + 1) / total * 100) + '%';
        prev.disabled = current === 0;
        next.disabled = current === total - 1;
        [].forEach.call(thumbs.children, function (b, k) { b.setAttribute('aria-current', k === current ? 'true' : 'false'); });
        var t = thumbs.children[current];
        if (t) thumbs.scrollTo({ left: t.offsetLeft - (thumbs.clientWidth - t.clientWidth) / 2, behavior: started ? 'smooth' : 'auto' });
        started = true;
        if (history.replaceState) history.replaceState(null, '', current ? '#' + (current + 1) : location.pathname);
        preload(current + 1); preload(current - 1);
      }

      prev.addEventListener('click', function () { go(current - 1); });
      next.addEventListener('click', function () { go(current + 1); });
      document.getElementById('hitPrev').addEventListener('click', function () { go(current - 1); });
      document.getElementById('hitNext').addEventListener('click', function () { go(current + 1); });

      document.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(total - 1);
        else if (e.key === 'f' || e.key === 'F') toggleFs();
      });

      var x0 = null;
      var stage = document.getElementById('stage');
      stage.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
        x0 = null;
      });

      function toggleFs() {
        var el = document.documentElement;
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (el.requestFullscreen) el.requestFullscreen().catch(function () { document.body.classList.toggle('fs'); });
        else document.body.classList.toggle('fs');
      }
      document.getElementById('fs').addEventListener('click', toggleFs);
      document.addEventListener('fullscreenchange', function () { document.body.classList.toggle('fs', !!document.fullscreenElement); });

      var fromHash = function () {
        var n = parseInt((location.hash || '').replace('#', ''), 10);
        return isNaN(n) ? 0 : n - 1;
      };
      window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== current) go(i); });
      go(fromHash());
    })();
  </script>
  <script src="/assets/ga.js"></script>
</body>
</html>
